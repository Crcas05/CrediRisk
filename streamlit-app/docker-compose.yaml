services:
  fastapi:
    image: crcas/credit-risk-api:dev
    build:
      context: ../inference
      dockerfile: Dockerfile
    ports:
      - "8001:8080"

  streamlit:
    image: crcas/credit-risk-streamlit:dev
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      API_URL: http://fastapi:8080
    depends_on:
      - fastapi
